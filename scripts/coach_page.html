<!doctype html>
<html lang="{{lang}}"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>{{title}}</title>
<style>
:root{--bg:#111;--panel:#1b1b1b;--panel2:#232323;--line:#333;--ink:#eee;--muted:#9a9a9a;--accent:#e0452b;--open:#ffd400;--good:#3fb950;--bad:#f0883e}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.4 -apple-system,system-ui,sans-serif}
header{padding:12px 16px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
h1{font-size:18px;margin:0}
.sim{font-size:12px;color:#111;background:var(--open);border-radius:10px;padding:2px 9px;cursor:help;font-weight:600}
.tabs{display:flex;gap:4px;margin-left:12px}
.tabs button{background:transparent;color:var(--muted);border:1px solid var(--line);border-radius:6px;padding:6px 12px;font:inherit;font-weight:600;cursor:pointer}
.tabs button.on{background:var(--accent);border-color:var(--accent);color:#fff}
.switch{color:var(--ink);font-size:13px;text-decoration:none;border:1px solid #3a3a3a;border-radius:6px;padding:4px 10px}
.switch:hover{border-color:var(--accent)}.switch.first{margin-left:auto}
main{display:grid;grid-template-columns:250px minmax(0,1fr) 410px;gap:14px;padding:0 16px;align-items:start}
main.watch{grid-template-columns:250px minmax(0,1fr)}main.watch #side{display:none}
main.game #stage,main.game #side{display:none}#game{display:none}main.game #game{display:block}
@media (max-width:1150px){main,main.watch{grid-template-columns:1fr}}
#list{display:flex;flex-direction:column;gap:6px;max-height:calc(100vh - 120px);overflow:auto}
#list .hint{color:var(--muted);font-size:13px;margin:0 0 4px}
.card{text-align:left;background:var(--panel);color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:8px 10px;font:inherit;cursor:pointer}
.card:hover{border-color:#555}.card.on{border-color:var(--accent);background:#2a1d1a}
.card .k{display:inline-block;min-width:18px;text-align:center;border-radius:4px;background:#333;color:#ddd;margin-right:6px;font-weight:600}
.card .top{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.card .name{font-weight:600;margin:2px 0}
.card .bot{display:flex;gap:6px;align-items:center;font-size:12px;color:var(--muted);flex-wrap:wrap}
.pill{white-space:nowrap;border-radius:9px;padding:1px 7px;font-size:11px;background:#333;color:#ddd}
.pill.att{background:#3a2a10;color:#f5c26b}.pill.def{background:#10283a;color:#7cc0f5}
.pill.good{background:#123a1c;color:#7ee39a}.pill.bad{background:#3a1d10;color:#f7a46b}.pill.note{background:var(--accent);color:#fff}
#board{display:flex;justify-content:space-between;align-items:center;background:var(--panel);border-radius:8px 8px 0 0;padding:6px 12px;font-variant-numeric:tabular-nums;gap:10px;flex-wrap:wrap}
#board .score{font-size:18px;font-weight:700}#board .muted{color:var(--muted);font-size:13px}
.panel{position:relative;background:#1b1b1b;overflow:hidden;display:flex;justify-content:center}
#court{display:block;max-width:100%;max-height:68vh;width:auto;height:auto;cursor:pointer;touch-action:none}
main.feedback.tool #court{cursor:crosshair}
.fs{position:absolute;right:8px;bottom:8px;border:0;border-radius:6px;background:#000a;color:#fff;font-size:18px;width:36px;height:32px;cursor:pointer}
.fs:hover{background:var(--accent)}
.panel:fullscreen{align-items:center;background:#000}.panel:fullscreen #court{max-height:100vh}
#caption{position:absolute;left:10px;top:10px;max-width:70%;background:#000c;border-left:3px solid var(--accent);padding:6px 10px;border-radius:4px;font-size:14px;display:none}
#tl{position:relative;height:22px;background:var(--panel2);cursor:pointer;touch-action:none}
#tlFill{position:absolute;left:0;top:0;bottom:0;background:#e0452b55}
#tlHead{position:absolute;top:0;bottom:0;width:2px;background:var(--accent)}
.mk{position:absolute;top:4px;width:8px;height:14px;margin-left:-4px;border-radius:2px;background:#bbb}
.mk.open_missed{background:var(--bad)}.mk.open_found{background:var(--good)}.mk.shot{background:#f08a24}.mk.note{background:var(--accent);top:0;height:22px;width:4px;margin-left:-2px}
.bar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;background:var(--panel);padding:8px 10px;border-radius:0 0 8px 8px}
.bar button,.bar select,#side button,#side select{background:#2a2a2a;color:var(--ink);border:1px solid #3a3a3a;border-radius:6px;padding:5px 10px;font:inherit;font-size:14px;cursor:pointer}
.bar button:hover,#side button:hover{border-color:var(--accent)}
.bar .on,#side .on{background:var(--accent);border-color:var(--accent)}
#play{width:44px}#time{font-variant-numeric:tabular-nums;color:var(--muted);min-width:96px}
.lbl{color:var(--muted);font-size:13px}.sp{flex:1}
#selInfo{min-height:24px;padding:6px 2px;color:#ddd;font-size:14px}
#side{background:var(--panel);border-radius:8px;padding:12px 14px;max-height:calc(100vh - 120px);overflow:auto}
#side h3{font-size:13px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);margin:16px 0 6px}
.det{font-size:14px;color:#ccc}.det b{color:#fff}
.verdict{font-size:16px;font-weight:600;margin:10px 0;padding:8px 10px;border-radius:6px;background:var(--panel2);border-left:4px solid #888}
.verdict.good{border-color:var(--good)}.verdict.bad{border-color:var(--bad)}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.tile{background:var(--panel2);border-radius:6px;padding:8px 10px}
.tile .l{font-size:12px;color:var(--muted)}.tile .v{font-size:22px;font-weight:700;font-variant-numeric:tabular-nums}.tile .u{font-size:12px;color:var(--muted)}
.moments{list-style:none;margin:0;padding:0}
.moments li{padding:6px 8px;border-radius:6px;cursor:pointer;display:flex;gap:8px;font-size:14px}
.moments li:hover{background:var(--panel2)}.moments li.now{background:#2a1d1a}
.moments .tm{color:var(--muted);font-variant-numeric:tabular-nums;min-width:34px}
.moments li.open_missed .tx{color:#f7a46b}.moments li.open_found .tx{color:#7ee39a}.moments li.shot .tx{font-weight:600}
table{border-collapse:collapse;width:100%;font-size:13px;font-variant-numeric:tabular-nums}
th{text-align:left;color:var(--muted);font-weight:600;border-bottom:1px solid var(--line);padding:4px 6px}
td{padding:4px 6px;border-bottom:1px solid #222}td.n,th.n{text-align:right}
tbody tr{cursor:pointer}tbody tr:hover{background:var(--panel2)}tr.sel{background:#2a1d1a}
.muted{color:var(--muted);font-size:12px}
.row{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin:6px 0}
textarea{width:100%;min-height:70px;background:#111;color:var(--ink);border:1px solid #3a3a3a;border-radius:6px;padding:8px;font:inherit}
#save{width:100%;background:var(--accent)!important;border-color:var(--accent)!important;font-weight:600;margin-top:6px}
.notes{list-style:none;margin:0;padding:0}
.notes li{background:var(--panel2);border-radius:6px;padding:7px 9px;margin-bottom:6px;cursor:pointer;font-size:14px}
.notes li.on{outline:2px solid var(--accent)}
.notes .h{display:flex;gap:6px;align-items:center;font-size:12px;color:var(--muted)}.notes .del{margin-left:auto;padding:1px 7px!important;font-size:12px!important}
.who{font-weight:600;margin:10px 0 4px}
#game{grid-column:2/-1;background:var(--panel);border-radius:8px;padding:12px 16px}
#game h3{font-size:13px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);margin:14px 0 6px}
footer{padding:10px 16px 20px;color:var(--muted);font-size:13px;line-height:1.6}
</style></head><body>
<header>
 <h1 data-t="h1"></h1><span class="sim" data-t="sim" data-tip="sim_tip"></span>
 <nav class="tabs"><button data-tab="watch" data-t="tab_watch"></button><button data-tab="insights" data-t="tab_insights"></button><button data-tab="feedback" data-t="tab_feedback"></button><button data-tab="game" data-t="tab_game"></button></nav>
 <a class="switch first" href="../" data-t="to_video"></a><a class="switch" href="{{lang_href}}" data-t="other_lang"></a>
</header>
<main id="main" class="watch">
 <aside id="list"></aside>
 <section id="stage">
  <div id="board"></div>
  <div class="panel" id="pC"><canvas id="court"></canvas><div id="caption"></div><button class="fs" id="fs" data-tip="fullscreen">⛶</button></div>
  <div id="tl"><div id="tlFill"></div><div id="tlMarks"></div><div id="tlHead"></div></div>
  <div class="bar">
   <button id="play" data-tip="play">▶</button><button id="back" data-tip="back">⏮</button><button id="fwd" data-tip="fwd">⏭</button>
   <span id="time"></span>
   <select id="rate" data-tip="speed"><option value="0.25">0.25×</option><option value="0.5">0.5×</option><option value="1" selected>1×</option></select>
   <span class="lbl" data-t="layers"></span>
   <button class="tog" data-l="names" data-t="names" data-tip="names_tip"></button>
   <button class="tog" data-l="trails" data-t="trails" data-tip="trails_tip"></button>
   <button class="tog" data-l="cover" data-t="cover" data-tip="cover_tip"></button>
   <button class="tog" data-l="shape" data-t="shape" data-tip="shape_tip"></button>
   <span class="sp"></span>
   <button id="zoom" data-t="zoom" data-tip="zoom_tip"></button>
   <button id="auto" data-t="auto" data-tip="auto_tip"></button>
  </div>
  <div id="selInfo"></div>
 </section>
 <aside id="side"><div id="pInsights"></div><div id="pFeedback">
  <div class="row"><span class="lbl" data-t="tools"></span>
   <button class="tool" data-tool="pen" data-t="pen"></button><button class="tool" data-tool="arrow" data-t="arrow"></button>
   <button class="tool" data-tool="move" data-t="move" data-tip="move_tip"></button><button id="undo" data-t="undo"></button></div>
  <div class="row"><span class="lbl" data-t="note_to"></span><select id="to"></select>
   <button class="tag" data-tag="good" data-t="tag_good"></button><button class="tag" data-tag="fix" data-t="tag_fix"></button></div>
  <textarea id="note"></textarea><button id="save"></button>
  <h3 data-t="notes_here"></h3><ul class="notes" id="notesHere"></ul>
  <h3 data-t="notes_all"></h3><div id="notesAll"></div>
  <div class="row"><button id="copy" data-t="copy"></button><button id="download" data-t="download"></button></div>
  <p class="muted" data-t="notes_local"></p>
 </div></aside>
 <section id="game"></section>
</main>
<footer id="footer"></footer>
<script>
const D = __DATA__, T = __T__, LANG = T.lang;
const $ = (id) => document.getElementById(id);
const tr = (s, o = {}) => s.replace(/\{(\w+)\}/g, (_, k) => (o[k] ?? ''));
const num = (x, d = 1) => Number(x).toLocaleString(LANG, {minimumFractionDigits: d, maximumFractionDigits: d});
const esc = (s) => String(s).replace(/[&<>"]/g, (ch) => ({'&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;'}[ch]));
const COL = {home: '#ececec', away: '#2f6fd0'}, INK = {home: '#111', away: '#fff'};
const surname = (n) => n.split(' ').slice(1).join(' ') || n;
const plays = D.plays, PX = 50, OPEN_M = D.open_m;
const ROSTER = {};

// ------------------------------------------------------------ data
for (const P of plays) {
  P.n = P.ball.length; P.dur = (P.n - 1) / P.fps;
  P.byId = {}; for (const p of P.players) { P.byId[p.id] = p; ROSTER[p.id] = p; }
  P.m = {}; P.v = {}; P.cum = {};
  for (const [pid, raw] of Object.entries(P.tracks)) {
    const m = raw.map(([x, y]) => [x / 100, y / 100]);
    const sm = m.map((_, i) => { let sx = 0, sy = 0, k = 0;
      for (let j = Math.max(0, i - 2); j <= Math.min(P.n - 1, i + 2); j++) { sx += m[j][0]; sy += m[j][1]; k++; }
      return [sx / k, sy / k]; });
    const v = new Float32Array(P.n), c = new Float32Array(P.n);
    for (let i = 1; i < P.n; i++) {
      c[i] = c[i - 1] + Math.hypot(sm[i][0] - sm[i - 1][0], sm[i][1] - sm[i - 1][1]);
      const a = Math.max(0, i - 5);
      v[i] = (c[i] - c[a]) / ((i - a) / P.fps);
    }
    P.m[pid] = m; P.v[pid] = v; P.cum[pid] = c;
  }
  P.bm = P.ball.map(([x, y, z]) => [x / 100, y / 100, z / 100]);
  P.shot = P.events.find((e) => e.type === 'shot');
}
const who = (pid) => { const p = ROSTER[pid]; if (!p) return pid;
  return p.team === 'home' ? `#${p.number} ${surname(p.name)}` : tr(T.opp_player, {n: p.number}); };
const fullName = (pid) => pid === 'team' ? T.team : `#${ROSTER[pid].number} ${ROSTER[pid].name}`;
const clock = (P, t) => { const s = Math.max(0, Math.floor(P.game.clock_start_s - t)); return `${Math.floor(s / 60)}:${String(s % 60).padStart(2, '0')}`; };
const scoreAt = (P, t) => (P.shot && P.shot.made && t >= P.shot.t1 ? P.game.score_after : P.game.score_before);
const playName = (P) => T.play_names[P.labels.play] || P.labels.play;
function momentText(m) {
  const o = {};
  for (const k of ['by', 'for', 'on', 'to_def', 'def_by']) if (m[k]) o[k] = who(m[k]);
  if (m.dur != null) o.dur = num(m.dur); if (m.dist != null) o.dist = num(m.dist);
  if (m.def_dist != null) o.def_dist = num(m.def_dist); if (m.xpts != null) o.xpts = num(m.xpts, 2);
  if (m.zone) o.zone = T.zones[m.zone]; if (m.open) o.open = T.open_names[m.open];
  o.res = m.made ? T.made : T.missed;
  return tr(T.m[m.kind] || m.kind, o);
}

// ------------------------------------------------------------ state
const S = {i: 0, t: 0, playing: false, rate: 1, sel: null, tab: 'watch', half: true, auto: true,
  layers: {names: true, trails: false, cover: false, shape: false}, tool: null, draft: [], cur: null, shown: null,
  tag: null, pos: {}};
let notes = []; try { notes = JSON.parse(localStorage.getItem('bga-coach-notes-v1') || '[]'); } catch (e) { notes = []; }
const persist = () => localStorage.setItem('bga-coach-notes-v1', JSON.stringify(notes));
const cur = () => plays[S.i];
const cv = $('court'), c = cv.getContext('2d');
let V = {x0: 0, y0: 0};
const X = (x) => (x - V.x0) * PX, Y = (y) => (y - V.y0) * PX;

function setView() {
  const P = cur();
  V = !S.half ? {x0: -0.5, x1: 28.5} : P.attacks === 'left' ? {x0: -0.5, x1: 15.5} : {x0: 12.5, x1: 28.5};
  V.y0 = -0.5; V.y1 = 15.5;
  cv.width = Math.round((V.x1 - V.x0) * PX); cv.height = Math.round((V.y1 - V.y0) * PX);
  $('zoom').classList.toggle('on', S.half);
}

// ------------------------------------------------------------ drawing
function court() {
  c.fillStyle = '#1b1b1b'; c.fillRect(0, 0, cv.width, cv.height);
  c.fillStyle = '#c39a66'; c.fillRect(X(0), Y(0), 28 * PX, 15 * PX);
  c.strokeStyle = '#fffffff0'; c.lineWidth = 2.5;
  const line = (pts) => { c.beginPath(); pts.forEach(([x, y], k) => (k ? c.lineTo(X(x), Y(y)) : c.moveTo(X(x), Y(y)))); c.stroke(); };
  const arc = (x, y, r, a0, a1, dash) => { c.beginPath(); c.setLineDash(dash || []); c.arc(X(x), Y(y), r * PX, a0, a1); c.stroke(); c.setLineDash([]); };
  for (const s of [1, -1]) {
    const fx = (d) => (s > 0 ? d : 28 - d), H = Math.PI / 2, a0 = s > 0 ? -H : H;
    c.fillStyle = '#b3884f';
    c.fillRect(Math.min(X(fx(0)), X(fx(5.8))), Y(5.05), 5.8 * PX, 4.9 * PX);
    c.strokeRect(Math.min(X(fx(0)), X(fx(5.8))), Y(5.05), 5.8 * PX, 4.9 * PX);
    arc(fx(5.8), 7.5, 1.8, a0, a0 + Math.PI); arc(fx(5.8), 7.5, 1.8, a0 + Math.PI, a0 + 2 * Math.PI, [9, 9]);
    line([[fx(0), 0.9], [fx(2.99), 0.9]]); line([[fx(0), 14.1], [fx(2.99), 14.1]]);
    const th = Math.asin(6.6 / 6.75), b0 = s > 0 ? 0 : Math.PI;
    arc(fx(1.575), 7.5, 6.75, b0 - th, b0 + th);
    arc(fx(1.575), 7.5, 1.25, a0, a0 + Math.PI);
    c.lineWidth = 4; line([[fx(1.2), 6.6], [fx(1.2), 8.4]]); c.lineWidth = 2.5;
    c.strokeStyle = '#ff7a1a'; arc(fx(1.575), 7.5, 0.225, 0, 7); c.strokeStyle = '#fffffff0';
  }
  c.strokeRect(X(0), Y(0), 28 * PX, 15 * PX);
  line([[14, 0], [14, 15]]); arc(14, 7.5, 1.8, 0, 7);
}
function hull(pts) {
  const p = pts.slice().sort((a, b) => a[0] - b[0] || a[1] - b[1]);
  const cr = (o, a, b) => (a[0] - o[0]) * (b[1] - o[1]) - (a[1] - o[1]) * (b[0] - o[0]);
  const lo = [], up = [];
  for (const q of p) { while (lo.length >= 2 && cr(lo[lo.length - 2], lo[lo.length - 1], q) <= 0) lo.pop(); lo.push(q); }
  for (const q of p.reverse()) { while (up.length >= 2 && cr(up[up.length - 2], up[up.length - 1], q) <= 0) up.pop(); up.push(q); }
  return lo.slice(0, -1).concat(up.slice(0, -1));
}
function arrow(a, b, col, w = 4, dash) {
  const ax = X(a[0]), ay = Y(a[1]), bx = X(b[0]), by = Y(b[1]), ang = Math.atan2(by - ay, bx - ax);
  c.strokeStyle = col; c.fillStyle = col; c.lineWidth = w; c.setLineDash(dash || []);
  c.beginPath(); c.moveTo(ax, ay); c.lineTo(bx - 10 * Math.cos(ang), by - 10 * Math.sin(ang)); c.stroke(); c.setLineDash([]);
  c.beginPath(); c.moveTo(bx, by); c.lineTo(bx - 18 * Math.cos(ang - 0.4), by - 18 * Math.sin(ang - 0.4));
  c.lineTo(bx - 18 * Math.cos(ang + 0.4), by - 18 * Math.sin(ang + 0.4)); c.closePath(); c.fill();
}
const label = (txt, x, y, col = '#fff', font = '600 15px system-ui') => {
  c.font = font; c.textAlign = 'center'; c.lineWidth = 4; c.strokeStyle = '#000b'; c.strokeText(txt, x, y); c.fillStyle = col; c.fillText(txt, x, y); };
function visibleDraws() {
  const out = S.tab === 'feedback' ? S.draft.slice() : [];
  const n = notes.find((q) => q.id === S.shown);
  if (n && n.play === cur().id && Math.abs(S.t - n.t) < 0.3) out.push(...n.draw);
  return out;
}
function draw() {
  const P = cur(), f = Math.min(S.t * P.fps, P.n - 1), i = Math.min(P.n - 2, Math.floor(f)), a = f - i;
  const at = (arr) => arr[i].map((v, k) => v + (arr[i + 1][k] - v) * a);
  const pos = {}; for (const pid in P.m) pos[pid] = at(P.m[pid]);
  S.pos = pos;
  court();
  const off = P.players.filter((p) => p.team === P.offence), def = P.players.filter((p) => p.team !== P.offence);
  if (S.layers.shape) for (const side of ['home', 'away']) {
    const h = hull(P.players.filter((p) => p.team === side).map((p) => pos[p.id]));
    c.beginPath(); h.forEach(([x, y], k) => (k ? c.lineTo(X(x), Y(y)) : c.moveTo(X(x), Y(y)))); c.closePath();
    c.fillStyle = side === 'home' ? '#ffffff22' : '#2f6fd033'; c.fill(); c.strokeStyle = side === 'home' ? '#ffffffaa' : '#2f6fd0'; c.lineWidth = 2; c.stroke();
  }
  if (S.layers.trails || S.sel) for (const p of P.players) {
    if (!S.layers.trails && p.id !== S.sel) continue;
    const m = P.m[p.id], from = p.id === S.sel ? 0 : Math.max(0, i - Math.round(1.5 * P.fps));
    c.beginPath(); for (let j = from; j <= i; j++) (j === from ? c.moveTo(X(m[j][0]), Y(m[j][1])) : c.lineTo(X(m[j][0]), Y(m[j][1])));
    c.strokeStyle = p.id === S.sel ? '#e0452bcc' : COL[p.team] + '99'; c.lineWidth = p.id === S.sel ? 3 : 2.5; c.stroke();
  }
  let open = [];
  if (S.layers.cover) for (const p of off) {
    let best = null, bd = 1e9;
    for (const q of def) { const d = Math.hypot(pos[p.id][0] - pos[q.id][0], pos[p.id][1] - pos[q.id][1]); if (d < bd) { bd = d; best = q; } }
    const A = pos[p.id], B = pos[best.id], isOpen = bd >= OPEN_M;
    if (isOpen) open.push(p.id);
    c.beginPath(); c.moveTo(X(A[0]), Y(A[1])); c.lineTo(X(B[0]), Y(B[1])); c.setLineDash([7, 6]);
    c.strokeStyle = isOpen ? '#ffd400' : '#ffffffaa'; c.lineWidth = isOpen ? 3 : 2; c.stroke(); c.setLineDash([]);
    label(`${num(bd)} m`, X((A[0] + B[0]) / 2), Y((A[1] + B[1]) / 2) - 6, isOpen ? '#ffd400' : '#fff', '600 14px system-ui');
  }
  if (S.tab !== 'watch') for (const m of cur().insights.moments) {

document.querySelectorAll('[data-t]').forEach((el) => (el.textContent = T[el.dataset.t]));
document.querySelectorAll('[data-tip]').forEach((el) => (el.title = T[el.dataset.tip]));
$('footer').innerHTML = tr(T.footer, {n: plays.length});
let last = null;
function tick(ts) {
  if (S.playing && last != null) {
    S.t += ((ts - last) / 1000) * S.rate;
    if (S.t >= cur().dur) {
      if (S.auto && S.tab === 'watch' && S.i < plays.length - 1) load(S.i + 1, true);
      else { S.t = cur().dur; S.playing = false; }
    }
  }
  last = ts; draw(); ui(); requestAnimationFrame(tick);
}
load(0, false); setTab('watch'); requestAnimationFrame(tick);
</script>
</body></html>
