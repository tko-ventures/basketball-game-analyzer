name: appearance-reid-plk-r1
description: >
  appearance-reid-sportsmot with the PLK fine-tune appearance/reid/plk-r1@553936e9 (configs/train/appearance-reid-plk-r1.yaml):
  osnet_x1_0_sportsmot trained on the crops_r1 identities of four non-gold games.
  bga eval-appearance scores the encoder on the gold boxes.
layers:
  shots:
    backend: gold
    params: {version: v0, stride: 5}
  court:
    backend: roboflow_keypoints
    params: {model_id: basketball-court-detection-2/14}
    weights: pretrained:roboflow/basketball-court-detection-2/14
  detect:
    backend: rfdetr_torch
    params: {confidence: 0.05}
    weights: detect/rfdetr_torch/plk-r3-poss@c62744fe
  team:
    backend: siglip_kmeans
    params: {seed: 0, fit_fps: 5.0}
    weights: pretrained:hf/google/siglip-base-patch16-224
  appearance:
    backend: reid
    params: {model: osnet_x1_0_sportsmot, min_score: 0.1}
    weights: appearance/reid/plk-r1@553936e9
  track:
    backend: trackers
    params:
      tracker: botsort
      cmc: internal
      reid_model: osnet_x1_0_sportsmot
      reid_config: {fusion: adaptive, appearance_threshold: 0.1, proximity_threshold: 1.0, appearance_weight: 1.25}
      args:
        track_activation_threshold: 0.8
        minimum_iou_threshold_first_assoc: 0.1
        minimum_iou_threshold_second_assoc: 0.2
        minimum_iou_threshold_unconfirmed_assoc: 0.3
        high_conf_det_threshold: 0.3
