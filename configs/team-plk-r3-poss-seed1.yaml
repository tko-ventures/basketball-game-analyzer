name: team-plk-r3-poss-seed1
description: >
  M5 team layer. detect-plk-r3-poss with siglip_kmeans seeded (UMAP and KMeans random_state 1), so a rerun gives the
  same teams. Scored against detect-plk-r3-poss.yaml, which differs only by the seed; its siblings seed1 to seed4
  measure how much team accuracy moves with the random starts alone.
layers:
  shots:
    backend: gold
    params: {version: v0, stride: 5}
  court:
    backend: roboflow_keypoints
    params: {model_id: basketball-court-detection-2/14}
    weights: pretrained:roboflow/basketball-court-detection-2/14
  detect:
    backend: rfdetr_torch
    params: {confidence: 0.05}
    weights: detect/rfdetr_torch/plk-r3-poss@c62744fe
  team:
    backend: siglip_kmeans
    params: {seed: 1}
    weights: pretrained:hf/google/siglip-base-patch16-224
  track:
    backend: bytetrack
  positions:
    backend: bbox_bottom
  numbers:
    backend: smolvlm_ocr
    params: {model_id: basketball-jersey-numbers-ocr/3}
    weights: pretrained:roboflow/basketball-jersey-numbers-ocr/3
