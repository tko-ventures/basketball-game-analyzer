name: court-plk-v1
description: >
  The baseline with the court layer swapped for the first PLK court keypoint model (RF-DETR Keypoint
  trained by configs/train/court-rfdetr_keypoint-plk-v1.yaml). Every other layer is unchanged, so
  rows against baseline.yaml compare the court models alone.
layers:
  shots:
    backend: gold
    params: {version: v0, stride: 5}
  court:
    backend: rfdetr_keypoint
    weights: court/rfdetr_keypoint/plk-v1@c26b7841
  detect:
    backend: roboflow_inference
    params: {model_id: basketball-player-detection-3-ycjdo/6, confidence: 0.4}
    weights: pretrained:roboflow/basketball-player-detection-3-ycjdo/6
  team:
    backend: siglip_kmeans
    weights: pretrained:hf/google/siglip-base-patch16-224
  track:
    backend: bytetrack
  positions:
    backend: bbox_bottom
  numbers:
    backend: smolvlm_ocr
    params: {model_id: basketball-jersey-numbers-ocr/3}
    weights: pretrained:roboflow/basketball-jersey-numbers-ocr/3
