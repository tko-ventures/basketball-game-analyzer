name: ball-plk-fused-v5-r4
description: >
  Layer 7 v5 on plk-r4-l4 (#48): ball-plk-fused-v4-r4 plus outcome_local_rw 4.0, so a tracked point first seen more than 4 rim
  widths from the rim after a rim arrival (a tracker jump to another candidate) no longer calls the shot missed.
  Scored against ball-plk-fused-v4-r4.
layers:
  shots:
    backend: gold
    params: {version: v0, stride: 5}
  court:
    backend: rfdetr_keypoint
    params: {smooth_window: 4}
    weights: court/rfdetr_keypoint/plk-v1@c26b7841
  detect:
    backend: rfdetr_torch
    params: {confidence: 0.05}
    weights: detect/rfdetr_torch/plk-r4-l4@c5abaa28
  team:
    backend: siglip_kmeans
    params: {seed: 0, fit_fps: 5.0}
    weights: pretrained:hf/google/siglip-base-patch16-224
  appearance:
    backend: reid
    params: {model: osnet_x1_0_sportsmot, min_score: 0.1}
    weights: appearance/reid/plk-r1-shot-last@bef4a309
  track:
    backend: trackers
    weights: appearance/reid/plk-r1-shot-last@bef4a309
    params:
      tracker: botsort
      cmc: internal
      reid_model: weights
      reid_config: {fusion: adaptive, appearance_threshold: 0.12, proximity_threshold: 1.0, appearance_weight: 0.6}
      args:
        track_activation_threshold: 0.8
        minimum_iou_threshold_first_assoc: 0.1
        minimum_iou_threshold_second_assoc: 0.2
        minimum_iou_threshold_unconfirmed_assoc: 0.3
        high_conf_det_threshold: 0.3
  link:
    backend: greedy
    params: {max_gap_s: 10.0, max_cost: 0.3, ends: 5, max_speed_mps: 8.0, court_slack_m: 2.0, max_per_team: 5}
  numbers:
    backend: parseq
    weights: numbers/parseq/r2@c4b3dde8
    params: {stop_on_confirm: false}
  identity:
    backend: game
    params: {roster: true, margin: 8.0, max_dist: 0.18}
  positions:
    backend: bbox_bottom
  ball:
    backend: fused
    params:
      shot_release_rim_excl_rw: 2.0
      shot_team_window_s: 2.0
      ball_far_penalty: 1.5
      ball_min_conf: 0.10
      static_cluster_px: 8.0
      poss_loose_bonus: 1.0
      poss_loose_pre_s: 0.3
      poss_loose_post_s: 2.5
      ball_rim_bonus: 0.6
      ball_rim_bonus_rw: 1.5
      shot_strict_arc: true
      outcome_local_rw: 4.0
