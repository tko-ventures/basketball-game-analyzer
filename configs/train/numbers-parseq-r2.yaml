name: r2
layer: numbers
backend: parseq
description: >
  numbers-parseq-r1 with the round-2 number crops added (data/labels/numbers/train_r2.json, eight more 2025/26
  games): 864 number tracklets with 27,003 crops of 33 numbers, where round 1 had 208 tracklets with 5,233 crops,
  and 3,075 unreadable crops (illegible and not-a-number tracklets, strays) where round 1 had 700. 670 of the
  round-2 number tracklets carry the label numbers/parseq/r1 settled (at least 0.8 of at least 10 reads; 58 of 60
  agree with a blind sheet read, none with another number), 194 a blind sheet read. Same model, loss, padding and
  augmentation; 10 epochs, about 3.5 times round 1's steps. The King game validates, as in round 1. Aims: decline
  more non-numbers than round 1 (0.461 on gold dev) and read opponents' kits.
