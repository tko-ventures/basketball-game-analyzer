name: plk-r4
layer: detect
backend: rfdetr_torch
description: >
  Fourth PLK detector (#40): plk-r3-poss's data and recipe plus round 4, 228 hard frames mined from the cached
  plk-r3-poss detections of non-gold clips (crowded paint, shots, contact, unsure ball), with the implementer's
  first pass (airborne shooters and baseline referees boxed from the draft's weaker boxes) and Tomasz's ball,
  people and possession review (train_manifest_r4_poss.json). Scored against plk-r3-poss, which differs only by
  round 4.
