name: resnet18-r1-fact
layer: numbers
backend: crop_cls
description: >
  numbers-crop_cls-resnet18-r1 with the factorised head (#30): 21 outputs, unreadable, the tens digit (none, 1 to 9)
  and the ones digit (0 to 9), instead of one output per number. Same weights, crops, split, augmentation and recipe;
  only the head and its loss differ, so the gold row shows what sharing digits across numbers is worth. Round 1 read
  players more than digits (0.361 on gold dev against 0.653 for the baseline), and could not answer the numbers it
  had no crops of. ImageNet weights are used under the decision of 2026-11-22 (re-check before shipping).
base_weights:
  name: resnet18.tv_in1k
  url: https://huggingface.co/timm/resnet18.tv_in1k
  licence: BSD-3-Clause tag on the weights; trained on ImageNet (research-only terms), used under the decision of 2026-11-22
package: timm==1.0.30
sources:
  - kind: manifest
    path: data/labels/numbers/train_r1.json
    sha256: 2e28c1061c31dee0de9ff588a6934c6629be34a4a924678c1bc4248db4dd6feb
recipe:
  resolution: 128
  epochs: 30
  batch_size: 128
  lr: 0.001
  seed: 0
  select_on: val/top1
  pad: 10
  illegible_as_unreadable: true
  head: factorised
  val_clips:
    - 20251113_kW4HG-5MLNM_SKROT_Dziki_-_King_8._kolejka
platform:
  name: modal
  gpu: L4
  timeout_h: 1
