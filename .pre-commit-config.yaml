# Pinned lint, format, and security hooks, after Borda's pre-commit setups (e.g. Borda/AI-Rig).
# Run hooks, not bare tools: `uv run pre-commit run --all-files`, or `uv run pre-commit run <hook-id> --files <path>`.

exclude: ^(data|runs|weights|logs|src/bga/track/_sv_bytetrack|src/bga/ingest/_transnetv2)/

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: 3e8a8703264a2f4a69428a0aa4dcb512790b2c8c # v6.0.0
    hooks:
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: check-json
      - id: check-yaml
      - id: check-toml
      - id: check-executables-have-shebangs
      - id: check-shebang-scripts-are-executable
      - id: check-case-conflict
      - id: check-added-large-files
        args: ["--maxkb=1024"]
      - id: detect-private-key
      - id: check-merge-conflict
      - id: mixed-line-ending
        args: ["--fix=lf"]

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: 9026c9127e153371d7a78dfcb0c45ae2046a3d10 # v0.17.6
    hooks:
      - id: ruff-check
        args: ["--fix"]
      - id: ruff-format

  - repo: https://github.com/PyCQA/docformatter
    rev: 0032269a0e65c068af9cd86c9a8859a0ddd568d6 # v1.7.8
    hooks:
      - id: docformatter
        args: ["--in-place", "--config=pyproject.toml"]

  - repo: https://github.com/codespell-project/codespell
    rev: 57b21406f092110c18776e39b0bda50d37c945c8 # v2.4.3
    hooks:
      - id: codespell
        # Report only: --write-changes once turned `bga.eval.mot` into `bga.eval.not`.

  - repo: local
    hooks:
      - id: agent-commit-identity
        name: agent commit identity guard
        entry: python3 scripts/check_agent_identity.py
        language: system
        pass_filenames: false

      - id: gitleaks
        name: gitleaks (staged secrets)
        entry: python3 scripts/run_gitleaks.py --staged
        language: system
        pass_filenames: false

  - repo: https://github.com/zizmorcore/zizmor-pre-commit
    rev: c7d31dc612dffdd4d3b2f2b88b9660d3ab057ee8 # v1.33.1
    hooks:
      - id: zizmor

  - repo: https://github.com/shellcheck-py/shellcheck-py
    rev: 745eface02aef23e168a8afb6b5737818efbea95 # v0.11.0.1
    hooks:
      - id: shellcheck
