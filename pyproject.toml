[project]
name = "bga"
version = "0.0.1"
description = "Basketball game analyzer: PLK broadcast-camera detection, tracking, identity and 2D court mapping"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
  "numpy>=2.0",
  "opencv-python-headless>=4.10",
  "pydantic>=2.9",
  "pyyaml>=6.0",
  "typer>=0.12",
]

[project.scripts]
bga = "bga.cli:app"

[project.optional-dependencies]
# ONNX Runtime with the CoreML provider on Apple silicon (detect/onnx_rfdetr.py).
onnx = ["onnxruntime>=1.20"]
prefill = [
    "inference>=1.8.3",
]
remote = [
    "modal>=1.6",
]
# Gold-set metrics: TrackEval (HOTA, CLEAR, Identity) pinned to a commit, pycocotools for box AP.
eval = [
    "pycocotools>=2.0.8",
    "trackeval @ git+https://github.com/JonathonLuiten/TrackEval.git@12c8791b303e0a0b50f753af204249e622d0281a",
]
# RF-DETR inference on the Mac (MPS) for weights trained by `bga train` (court/rfdetr_keypoint).
court = ["rfdetr==1.12.1"]
demo = [
    "scikit-learn>=1.9.1",
    "sentencepiece>=0.2.2",
    "sports",
    "transformers>=5.15.1",
    "umap-learn>=0.5.12",
]
plus = [
    "rfdetr-plus==1.3.0",
]
# Tracking and appearance (M6): Roboflow trackers (BoT-SORT with re-ID) and reid encoders.
track = [
    "reid==0.1.0",
    "trackers==2.7.0",
]

[dependency-groups]
dev = ["pre-commit>=4.0", "pytest>=8.3", "ruff==0.17.5"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bga"]

[tool.ruff]
# Lint and format follow Jirka Borovec's (Borda) configs, e.g. Borda/vision-synth; see CLAUDE.md "Python style".
line-length = 120
target-version = "py312"
extend-exclude = ["data", "runs", "weights", "src/bga/track/_sv_bytetrack"]
format.preview = true
lint.select = [
  "D",  # see: https://pypi.org/project/pydocstyle
  "E",  # see: https://pypi.org/project/pycodestyle
  "F",  # see: https://pypi.org/project/pyflakes
  "I",  # see: https://pypi.org/project/isort/
  "N",  # see: https://pypi.org/project/pep8-naming
  "S",  # see: https://pypi.org/project/flake8-bandit
  "UP", # see: https://docs.astral.sh/ruff/rules/#pyupgrade-up
  "W",  # see: https://pypi.org/project/pycodestyle
]
lint.extend-select = [
  "A",    # see: https://pypi.org/project/flake8-builtins
  "ANN",  # see: https://pypi.org/project/flake8-annotations
  "B",    # see: https://pypi.org/project/flake8-bugbear
  "C4",   # see: https://pypi.org/project/flake8-comprehensions
  "C90",  # see: https://docs.astral.sh/ruff/rules/complex-structure
  "EXE",  # see: https://pypi.org/project/flake8-executable
  "ISC",  # see: https://pypi.org/project/flake8-implicit-str-concat
  "PERF", # see: https://pypi.org/project/perflint/
  "PIE",  # see: https://pypi.org/project/flake8-pie
  "PLE",  # see: https://pypi.org/project/pylint/
  "PLR0911", # too-many-return-statements, see lint.pylint below
  "PLR0912", # too-many-branches
  "PLR0913", # too-many-arguments
  "PLR0915", # too-many-statements
  "PT",   # see: https://pypi.org/project/flake8-pytest-style
  "PYI",  # see: https://pypi.org/project/flake8-pyi/
  "Q",    # see: https://pypi.org/project/flake8-quotes
  "RET",  # see: https://pypi.org/project/flake8-return
  "RUF",  # Ruff-specific rules
  "SIM",  # see: https://pypi.org/project/flake8-simplify
  "T10",  # see: https://pypi.org/project/flake8-debugger
  "TID",  # see: https://pypi.org/project/flake8-tidy-imports/
  "YTT",  # see: https://pypi.org/project/flake8-2020
]
lint.ignore = [
  "E731", # Do not assign a lambda expression, use a def
]
# On-screen text uses typographic dashes and the multiplication sign on purpose.
lint.allowed-confusables = ["–", "×"]
lint.per-file-ignores."scripts/**/*.py" = [
  "ANN", # type annotations not required in one-off scripts
  "D",   # module docstring covers the script; per-function docs not required
  "N",   # relaxed naming (H, K, X etc. are idiomatic in image and geometry code)
  "S",   # security rules relaxed for local scripts
]
lint.per-file-ignores."tests/**/*.py" = [
  "ANN",   # No type annotations required in tests
  "D",     # No docstrings required in tests
  "E741",  # Ambiguous variable name (I for identity matrix)
  "N",     # Naming conventions relaxed in tests (H, W, B, etc.)
  "PT006", # parametrize argument style is relaxed
  "S101",  # Use of `assert` detected
]
lint.mccabe.max-complexity = 12
lint.pydocstyle.convention = "google"
lint.pylint.max-args = 12
lint.pylint.max-branches = 12
lint.pylint.max-returns = 6
lint.pylint.max-statements = 50

[tool.codespell]
skip = "*.json,*.csv,*.lock,*.txt,*.html,data/*,runs/*,weights/*"
# FIBA country codes ("NED"), numpy names ("nd"), MOT (multi-object tracking) and SME (subject-matter expert).
ignore-words-list = "mot,ned,nd,sme"
quiet-level = 3

[tool.docformatter]
recursive = true
wrap-summaries = 120
# 0 leaves description paragraphs alone: wrapping them flattened usage blocks and tables into prose.
wrap-descriptions = 0
blank = true

[tool.pytest.ini_options]
testpaths = ["src", "tools", "tests"]
pythonpath = ["."]
addopts = "--doctest-modules"
doctest_optionflags = "NORMALIZE_WHITESPACE ELLIPSIS"

[tool.uv]
# One OpenCV only: `inference` also pulls opencv-python and opencv-contrib-python, which share the cv2
# package directory with the headless wheel, so switching extras would half-delete cv2.
# `inference` pins trackers below 2.5 and supervision below 0.31; BoT-SORT with re-ID needs trackers 2.7, which needs
# supervision 0.31. We call only `inference.get_model`; the baseline row is re-run unchanged on the upgraded set (M6).
override-dependencies = [
  "opencv-python; sys_platform == 'never'",
  "opencv-contrib-python; sys_platform == 'never'",
  "supervision>=0.31,<0.32",
  "trackers==2.7.0",
]

[tool.hatch.metadata]
allow-direct-references = true

[tool.uv.sources]
sports = { git = "https://github.com/roboflow/sports.git", rev = "415751384e34f1cb7089a00909e0d7932fe73a75" }
