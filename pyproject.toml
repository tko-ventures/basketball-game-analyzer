[project]
name = "bga"
version = "0.0.1"
description = "Basketball game analyzer: PLK broadcast-camera detection, tracking, identity and 2D court mapping"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
  "numpy>=2.0",
  "opencv-python-headless>=4.10",
]

[project.optional-dependencies]
# ONNX Runtime with the CoreML provider on Apple silicon (detect/onnx_rfdetr.py).
onnx = ["onnxruntime>=1.20"]
prefill = [
    "inference>=1.8.3",
]

[dependency-groups]
dev = ["pytest>=8.3", "ruff>=0.7"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bga"]

[tool.ruff]
line-length = 110
target-version = "py312"
extend-exclude = ["data", "runs", "weights"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
