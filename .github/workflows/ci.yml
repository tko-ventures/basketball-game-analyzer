# CI: the merge gate from AGENTS.md "Tooling" (`uv run pre-commit run --all-files` and `uv run pytest`).
# Tests need no videos, weights, network or GPU; doctests import every module under src/ and tools/, so the
# extras those modules import at top level are installed (heavy model extras such as court, plus, prefill and onnx
# are not needed).
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pytest:
    name: pytest (unit, doctests, gold leakage)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      # setup-uv publishes no floating major tag, so it is pinned to a release.
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: uv.lock
          # Keep only wheels built from source (git pins); registry wheels such as torch re-download faster.
          prune-cache: true
      - name: Install locked dependencies
        run: uv sync --frozen --extra remote --extra eval --extra track --extra demo --extra parseq
      - name: Run pytest
        run: uv run --no-sync pytest -rs

  pre-commit:
    name: pre-commit hooks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: uv.lock
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ runner.os }}-${{ hashFiles('.pre-commit-config.yaml') }}
      - name: Run pre-commit on all files
        run: uv run --frozen --only-group dev pre-commit run --all-files --show-diff-on-failure
